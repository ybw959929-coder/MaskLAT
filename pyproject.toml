[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "masklat"
version = "0.1.0"
description = "Grouped latent reasoning for vision-language segmentation"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["masklat*"]

[tool.black]
line-length = 119

[tool.isort]
profile = "black"

