name: Expand MaskLAT source archive
on:
  push:
    branches: [main]
    paths: [.github/workflows/expand-source-once.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and expand original source files
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, stat, subprocess, zipfile
          root = Path.cwd().resolve()
          archive = root / 'MaskLAT.zip'
          expected = 'c74b0979008bab61e4955c7ebe45a3e68c79b2df7e8d01f6fb32751d6618d055'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          files = {}
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for entry in z.infolist():
                  if entry.is_dir():
                      continue
                  parts = PurePosixPath(entry.filename).parts
                  assert parts[0] == 'MaskLAT' and len(parts) > 1
                  relative = PurePosixPath(*parts[1:])
                  assert not relative.is_absolute()
                  assert all(part not in ('..', '.git', '.github') for part in relative.parts)
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  target = (root / relative).resolve()
                  assert target.is_relative_to(root)
                  assert relative.as_posix() not in files
                  data = z.read(entry)
                  if target.exists():
                      assert target.is_file() and target.read_bytes().replace(b'\r\n', b'\n') == data.replace(b'\r\n', b'\n'), str(relative)
                  files[relative.as_posix()] = data
          assert len(files) == 228
          for relative, data in files.items():
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          subprocess.run(['git', 'add', '--', *sorted(files)], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          assert set(filter(None, staged)).issubset(files)
          print('Verified and expanded all 228 original source files.')
          PY
      - name: Publish expanded source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Source tree already matches the archive.'
          else
            git commit -m 'Expand original MaskLAT archive into browsable source tree'
            git push origin HEAD:main
          fi
